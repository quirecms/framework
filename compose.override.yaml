---
# Development environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}${COMPOSE_PROJECT_NAME:-quire}-php-dev
    build:
      context: .
      target: frankenphp_dev
    volumes:
      - ./:/app
      - ./frankenphp/Caddyfile:/etc/frankenphp/Caddyfile:ro
      - ./frankenphp/conf.d/20-app.dev.ini:/usr/local/etc/php/app.conf.d/20-app.dev.ini:ro
      # Keep var/ off the bind-mount for faster I/O on Mac/Windows; comment to inspect from the host.
      - /app/var
      # If you develop on Mac or Windows you can remove the vendor/ directory
      #  from the bind-mount for better performance by enabling the next line:
      #- /app/vendor
    environment:
      FRANKENPHP_WORKER_CONFIG: watch
      # Browsers mustn't remember to require HTTPS for a development address.
      QUIRE_HSTS_MAX_AGE: 0
      # See https://xdebug.org/docs/all_settings#mode
      XDEBUG_MODE: "${XDEBUG_MODE:-off}"
      APP_ENV: "${APP_ENV:-dev}"
      # Emails go to Mailpit; read them at the address "docker compose port mailer 8025" shows.
      MAILER_DSN: smtp://mailer:1025
      # >>> development only
      # The S3 service below, for the tests of S3 disks.
      QUIRE_TEST_S3_ENDPOINT: http://s3:8333
      # <<< development only
    extra_hosts:
      # Ensure that host.docker.internal is correctly defined on Linux
      - host.docker.internal:host-gateway
    tty: true
    healthcheck:
      # The first start installs the dependencies, which can take minutes on a slow connection. The
      # image's check still runs; failures only start to count after this.
      start_period: 5m

  worker:
    image: ${IMAGES_PREFIX:-}${COMPOSE_PROJECT_NAME:-quire}-php-dev
    build:
      context: .
      target: frankenphp_dev
    # Restarts every 5 minutes, so it runs code you changed; or run "docker compose restart worker".
    command: ["php", "bin/console", "messenger:consume", "quire", "--time-limit=300", "--memory-limit=256M"]
    volumes:
      - ./:/app
      - /app/var
    environment:
      APP_ENV: "${APP_ENV:-dev}"
      MAILER_DSN: smtp://mailer:1025
      # >>> development only
      QUIRE_TEST_S3_ENDPOINT: http://s3:8333
      # <<< development only

###> doctrine/doctrine-bundle ###
  database:
    ports:
      - "5432"
###< doctrine/doctrine-bundle ###

###> symfony/mailer ###
  mailer:
    image: axllent/mailpit
    ports:
      - "1025"
      - "8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
###< symfony/mailer ###

  # >>> development only: an S3 service for the tests of storage disks
  # An S3-compatible service (SeaweedFS), to develop and test storage disks on S3. Its S3 API is at
  # "docker compose port s3 8333"; it accepts any credentials.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    ports:
      - "8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
  # <<< development only
