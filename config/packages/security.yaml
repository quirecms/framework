security:
    # Quire registers a password hasher for its users and the user provider "quire_users"; see
    # docs/users.md. Hashers for other user classes of the application can be added here.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: quire_users
            user_checker: Quire\User\Security\UserChecker
            # Ways to sign in that extensions add (Extend\Auth), e.g. single sign-on.
            custom_authenticators: [Quire\User\Security\ExtensionAuthenticators]
            # Quire's sign-in page; its texts and look come from the theme.
            form_login:
                login_path: quire_login
                check_path: quire_login
                enable_csrf: true
                default_target_path: quire_home
            logout:
                path: quire_logout
                target: quire_home
                enable_csrf: true
            # "Keep me signed in": a signed cookie, which stops working once the password changes.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
                signature_properties: [password]
            # After 5 failed attempts for an account from one address within a minute, wait a minute.
            login_throttling:
                max_attempts: 5
                interval: '1 minute'

    # Note: Only the *first* matching rule is applied
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Quire\User\User: &test_hasher
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: *test_hasher
