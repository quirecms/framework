quire:
    extensions:
        # Enable and disable extensions with "bin/console quire:extension:enable|disable".
        # For immutable production images, fix the enabled extensions here instead:
        #
        # pinned: true
        # enabled: [quire-admin, acme-reviews]
        pinned: false

when@test:
    quire:
        extensions:
            # Tests run with a fixed set of extensions: the fixture extension in tests/Fixtures.
            installed_json: '%kernel.project_dir%/tests/Fixtures/installed.json'
            pinned: true
            enabled: [quire-fixture-hello]
