services:
    # Counts database queries, for assertions that listings don't make one query per item (N+1).
    Quire\Testing\Database\QueryLog: ~
    Quire\Testing\Database\QueryLogMiddleware:
        autowire: true
        autoconfigure: true
    # The demo site, for tests that need a realistic one (see quire:demo:seed).
    Quire\Testing\Demo\DemoSite:
        autowire: true
        public: true
