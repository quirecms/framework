---
name: Runtime

# Quire's runtime images (runtime/Dockerfile), which sites build FROM: ghcr.io/quirecms/runtime:8.5-builder
# and :8.5, for x86_64 and arm64, with their SBOM and build provenance, signed with Sigstore (keyless:
# the signature says this workflow made them, from main). Rebuilt every week, so PHP's, FrankenPHP's
# and Debian's security fixes reach sites at their next build, and whenever runtime/ changes. Each
# build also keeps a dated tag (8.5-20261028, 8.5-builder-20261028). A tag moves to a build only once
# it's signed and its signature checks out.
on:
  push:
    branches:
      - main
    paths:
      - 'runtime/**'
      - '.github/workflows/runtime.yaml'
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  runtime:
    name: Runtime (${{ matrix.image }})
    if: github.repository == 'quirecms/framework'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      packages: write   # the images on ghcr.io
      id-token: write   # Sigstore's keyless signing: this workflow's identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: builder
            tag: '8.5-builder'
          - image: runtime
            tag: '8.5'
    env:
      IMAGE: ghcr.io/quirecms/runtime
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The date of this build
        id: date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The upstream images' current tags, pulled fresh: their security fixes are the point.
      # Pushed by its digest only, with no tag: the tags move to it once it's signed (below), so a
      # tag never names a build without a signature. Quire Server refuses to build on one, and a
      # site building in between (the night's updates start at 03:00 UTC) failed (2026-11-18).
      - name: Build and push the image (by digest, untagged)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: runtime
          target: ${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          pull: true
          no-cache: true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.title=Quire runtime (${{ matrix.image }})
            org.opencontainers.image.description=PHP with Quire's extensions, FrankenPHP and the PostgreSQL tools, which Quire sites build on.
            org.opencontainers.image.source=https://github.com/quirecms/framework
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.vendor=YorvoLabs
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # As Quire Server checks it before building on it: this workflow's identity, from main.
      - name: Check its signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/runtime.yaml@refs/heads/main
        run: >-
          cosign verify "$IMAGE@$DIGEST"
          --certificate-identity "$IDENTITY"
          --certificate-oidc-issuer https://token.actions.githubusercontent.com
          >/dev/null

      # Only now do the tags name this build: the dated one first, then the one sites build on. With one
      # source, imagetools copies the index as it is, so a tag names the very digest that was signed.
      # Each tag is read back; one that names another digest (a registry that re-serialized the index)
      # is put back where it was, and the job fails. A dated tag that didn't exist before has nowhere to
      # go back to: it's left on that unsigned digest, which Quire Server refuses, and :8.5 isn't moved.
      - name: Tag it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ matrix.tag }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          digest_of() {
            docker buildx imagetools inspect "$IMAGE:$1" --format '{{.Manifest.Digest}}' 2>/dev/null || true
          }
          move() {
            previous=$(digest_of "$1")
            docker buildx imagetools create --tag "$IMAGE:$1" "$IMAGE@$DIGEST"
            tagged=$(digest_of "$1")
            [ "$tagged" = "$DIGEST" ] && return 0
            echo "::error::$IMAGE:$1 names ${tagged:-nothing readable}, not the signed $DIGEST"
            if [ -n "$previous" ]; then
              docker buildx imagetools create --tag "$IMAGE:$1" "$IMAGE@$previous" || true
              restored=$(digest_of "$1")
              [ "$restored" = "$previous" ] && echo "::error::$IMAGE:$1 is back on $previous" \
                || echo "::error::$IMAGE:$1 couldn't be put back on $previous: it names ${restored:-nothing readable}"
            else
              echo "::error::$IMAGE:$1 didn't exist before: it stays on that digest, which has no signature"
            fi
            exit 1
          }
          move "$TAG-$DATE"
          move "$TAG"
