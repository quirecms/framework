---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  qa:
    name: Quality checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build dev image
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          # On the runtime images of this commit (runtime/), not the published ones
          files: |
            compose.yaml
            compose.override.yaml
            .github/runtime.hcl
          set: |
            *.cache-from=type=gha,scope=dev-${{ github.ref }}
            *.cache-from=type=gha,scope=dev-refs/heads/main
            *.cache-to=type=gha,scope=dev-${{ github.ref }},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Validate composer.json
        run: docker compose exec -T php composer validate --strict --no-check-publish
      - name: Warm up the dev container (needed by PHPStan's Symfony extension)
        run: docker compose exec -T php bin/console cache:warmup
      - name: Run quality checks and tests
        run: docker compose exec -T php composer qa
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://quire.localhost
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://quire.localhost
      - name: Check health endpoint
        run: curl -v --insecure --fail-with-body https://quire.localhost/_quire/health
      - name: Compare the admin's screens with the approved screenshots, then run its flows
        run: |
          # The demo site (only added to an empty site, so before the steps below add content).
          docker compose exec -T php bin/console quire:extension:enable quire-admin --no-interaction
          docker compose exec -T php bin/console quire:demo:seed
          playwright=$(jq -r '.dependencies["@playwright/test"]' tests/Browser/package.json)
          docker run --rm --network quire_default -e QUIRE_CHECK_SERVER=php -v "$PWD/tests/Browser:/work" -w /work "mcr.microsoft.com/playwright:v${playwright}-noble" \
            sh -c 'npm ci --no-audit --no-fund && npx playwright test'
      - name: Keep the screenshots that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: tests/Browser/test-results/
          if-no-files-found: ignore
      - name: Check the default theme's accessibility (WCAG 2.2 AA, with axe-core)
        run: |
          docker compose exec -T php bin/console quire:content:create post "Hello world" --body "Welcome to **Quire**, with a [link](https://example.com)." --publish
          docker compose exec -T php bin/console quire:content:create page "About" --body "About this site." --publish
          # The account pages, which are off by default.
          for setting in quire.auth.registration quire.auth.email_verification quire.auth.password_reset; do
            docker compose exec -T php bin/console quire:settings:set "$setting" true
          done
          # The image's browsers must match the playwright package, so its version comes from package.json
          # (and Dependabot's updates of the package update the image too). The browser runs on the
          # Compose network, not the host's: there, containers that restart (e.g. the worker, after
          # extensions change) add and remove interfaces, which aborts its page loads.
          playwright=$(jq -r '.dependencies.playwright' tests/Accessibility/package.json)
          docker run --rm --network quire_default -e QUIRE_CHECK_SERVER=php -v "$PWD/tests/Accessibility:/work" -w /work "mcr.microsoft.com/playwright:v${playwright}-noble" \
            sh -c 'npm ci --no-audit --no-fund && node check.mjs https://quire.localhost / /blog/hello-world /about /login /register /forgot-password /verify-email'
      - name: Check the admin's accessibility (WCAG 2.2 AA, with axe-core)
        run: |
          docker compose exec -T php bin/console quire:extension:enable quire-admin --no-interaction
          printf 'correct-horse-42\ncorrect-horse-42\n' | docker compose exec -T php bin/console quire:user:create admin@example.com --role=admin
          # The editor and the review, on the demo site's items: a draft with what the checks found, and changes
          # (the browser flows above approved those in review).
          sql() { docker compose exec -T database psql -U app -d app -Atc "$1"; }
          draft=$(sql "select id from quire.content where title = 'Referee assignments explained'")
          changes=$(sql "select '/admin/content/post/' || content_id || '/changes/' || id from quire.content_pending_revision order by created_at limit 1")
          playwright=$(jq -r '.dependencies.playwright' tests/Accessibility/package.json)
          docker run --rm --network quire_default -e QUIRE_CHECK_SERVER=php -e QUIRE_CHECK_LOGIN=admin:correct-horse-42 -v "$PWD/tests/Accessibility:/work" -w /work "mcr.microsoft.com/playwright:v${playwright}-noble" \
            sh -c 'npm ci --no-audit --no-fund && node check.mjs https://quire.localhost /admin /admin/content/post /admin/content/page "/admin/content/post?q=hello" /admin/content/post/new /admin/content/page/new /admin/content/post/'"$draft"' '"${changes%/changes/*}"' '"$changes"' /admin/settings /admin/settings/content /admin/themes /admin/extensions /admin/extensions/quire-admin/purge /admin/users /admin/users/new /admin/roles /admin/roles/member /admin/roles/admin "/admin/access?user=admin&ability=quire.settings.manage" /admin/audit "/admin/audit?area=user." /admin/ui "/admin/content/post?mode=board" "/admin/content/post?mode=calendar" "/admin/content/post?view=needs-me" "/admin/content/post?f[status][]=draft&f[checks][]=any" "/admin/find?q=spring" "/admin/find?q=schedule+venue+guide+friday+18:00" /admin/preferences'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  skeleton:
    name: Starter project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The skeleton is built from the application, as it's published (.github/skeleton.sh).
      - name: Build the skeleton
        run: .github/skeleton.sh "$RUNNER_TEMP/skeleton"
      - name: Validate composer.json
        run: docker run --rm -v "$RUNNER_TEMP/skeleton:/app" -w /app composer:2 validate --strict --no-check-publish
      - name: Create a site from the skeleton, as its README says, with the packages of this commit
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$RUNNER_TEMP/skeleton:/skeleton:ro" -v "$RUNNER_TEMP:/work" -w /work composer:2 \
            create-project --no-install --repository='{"type": "path", "url": "/skeleton", "options": {"symlink": false, "versions": {"quire/skeleton": "0.1.x-dev"}}}' \
            quire/skeleton site 0.1.x-dev
          # Instead of Packagist, the site installs the packages from a copy of packages/ inside it, which
          # its container sees. They're development versions of the next release.
          cp -r packages "$RUNNER_TEMP/site/quire-packages"
          versions=$(jq -n '[inputs.name] | map({(.): "0.1.x-dev"}) | add' packages/*/composer.json)
          jq --indent 4 --argjson versions "$versions" '.repositories = [{"type": "path", "url": "quire-packages/*", "options": {"versions": $versions}}] | ."minimum-stability" = "dev"' \
            "$RUNNER_TEMP/site/composer.json" > composer.json.site && mv composer.json.site "$RUNNER_TEMP/site/composer.json"
      - name: Check the site has its own secret
        run: grep -Eq '^APP_SECRET=[0-9a-f]{32}$' "$RUNNER_TEMP/site/.env.dev"
      # The runtime images of this commit, under the names the site's Dockerfile builds FROM
      - name: Build the runtime images
        run: |
          docker build --pull --target builder -t ghcr.io/quirecms/runtime:8.5-builder runtime
          docker build --target runtime -t ghcr.io/quirecms/runtime:8.5 runtime
      - name: Start the site
        working-directory: ${{ runner.temp }}/site
        run: |
          docker compose build
          docker compose up --wait
      - name: Install the site
        working-directory: ${{ runner.temp }}/site
        run: docker compose exec -T php bin/console quire:install --no-interaction --admin-email=ada@example.com --title="Ada's notes"
      - name: Check the site, and that it has the admin
        working-directory: ${{ runner.temp }}/site
        run: |
          curl -v --insecure --fail-with-body https://quire.localhost
          curl -v --insecure --fail-with-body https://quire.localhost/_quire/health
          docker compose exec -T php bin/console quire:extension:list | grep -E 'quire-admin +enabled'
          test "$(curl --insecure -s -o /dev/null -w '%{redirect_url}' https://quire.localhost/admin)" = 'https://quire.localhost/login'
      - name: Show logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/site
        run: docker compose logs

  prod:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      # As docs/docker.md says, with throwaway secrets and the domain of the checks below.
      - name: Create prod.env
        run: |
          cp prod.env.dist prod.env
          chmod 600 prod.env
          sed -i "s/^SERVER_NAME=.*/SERVER_NAME=quire.localhost/; s/^APP_SECRET=.*/APP_SECRET=$(openssl rand -hex 32)/; s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" prod.env
          for name in APP_SECRET POSTGRES_PASSWORD; do echo "::add-mask::$(sed -n "s/^${name}=//p" prod.env)"; done
      - name: Check Compose refuses to start without the secrets
        run: |
          if docker compose -f compose.yaml -f compose.prod.yaml config > /dev/null 2> refused.txt; then
            echo "compose.prod.yaml started without SERVER_NAME, APP_SECRET and POSTGRES_PASSWORD"; exit 1
          fi
          grep -q 'in prod.env' refused.txt
      # Bake reads compose.prod.yaml's variables from the environment, not from an env file.
      - name: Give the build the settings of prod.env
        run: grep -E '^(SERVER_NAME|APP_SECRET|POSTGRES_PASSWORD)=' prod.env >> "${GITHUB_ENV}"
      - name: Build prod image
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          # On the runtime images of this commit (runtime/), not the published ones
          files: |
            compose.yaml
            compose.prod.yaml
            .github/runtime.hcl
          set: |
            *.cache-from=type=gha,scope=prod-${{ github.ref }}
            *.cache-from=type=gha,scope=prod-refs/heads/main
            *.cache-to=type=gha,scope=prod-${{ github.ref }},mode=max
      - name: Start services
        run: docker compose --env-file prod.env up --wait --no-build
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://quire.localhost
      - name: Check health endpoint
        run: curl -v --insecure --fail-with-body https://quire.localhost/_quire/health
      - name: Check the security headers
        run: |
          headers="$(curl --silent --insecure --head https://quire.localhost)"
          for header in 'strict-transport-security: max-age=31536000' 'x-content-type-options: nosniff' 'x-frame-options: SAMEORIGIN' 'referrer-policy: strict-origin-when-cross-origin'; do
            grep -qi "^${header}" <<< "${headers}" || { echo "Missing: ${header}"; echo "${headers}"; exit 1; }
          done
          ! grep -qi '^server:' <<< "${headers}"
      - name: Check the app runs as a non-root user
        run: test "$(docker compose --env-file prod.env exec -T php id -u)" != "0"
      - name: Check the app can write to its storage volume
        run: docker compose --env-file prod.env exec -T php sh -c 'touch storage/public/.check storage/private/.check && rm storage/public/.check storage/private/.check'
      - name: Check the server contract's report
        run: docker compose --env-file prod.env exec -T php bin/console quire:about --format=json | jq -e '.contract == 1 and .health.status == "ok" and .migrations.pending == 0'
      # Behind a reverse proxy (compose.proxy.yaml): plain HTTP on this machine's loopback only, and
      # HTTPS as the proxy says it was.
      - name: Check the site behind a reverse proxy
        run: |
          sed -i 's/^COMPOSE_FILE=.*/COMPOSE_FILE=compose.yaml:compose.prod.yaml:compose.proxy.yaml/' prod.env
          docker compose --env-file prod.env up -d --wait --no-build
          test "$(docker compose --env-file prod.env port php 80)" = "127.0.0.1:8080"
          ! docker compose --env-file prod.env port php 443
          curl --fail --silent --output /dev/null -H 'Host: quire.localhost' http://127.0.0.1:8080/_quire/health
          curl --silent --dump-header - --output /dev/null -H 'Host: quire.localhost' -H 'X-Forwarded-Proto: https' http://127.0.0.1:8080/login | grep -qi '^set-cookie: .*; secure'
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file prod.env logs
