---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  qa:
    name: Quality checks and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build dev image
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=dev-${{ github.ref }}
            *.cache-from=type=gha,scope=dev-refs/heads/main
            *.cache-to=type=gha,scope=dev-${{ github.ref }},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Validate composer.json
        run: docker compose exec -T php composer validate --strict --no-check-publish
      - name: Warm up the dev container (needed by PHPStan's Symfony extension)
        run: docker compose exec -T php bin/console cache:warmup
      - name: Run quality checks and tests
        run: docker compose exec -T php composer qa
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://quire.localhost
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://quire.localhost
      - name: Check health endpoint
        run: curl -v --insecure --fail-with-body https://quire.localhost/_quire/health
      - name: Check the default theme's accessibility (WCAG 2.2 AA, with axe-core)
        run: |
          docker compose exec -T php bin/console quire:content:create post "Hello world" --body "Welcome to **Quire**, with a [link](https://example.com)." --publish
          docker compose exec -T php bin/console quire:content:create page "About" --body "About this site." --publish
          # The account pages, which are off by default.
          for setting in quire.auth.registration quire.auth.email_verification quire.auth.password_reset; do
            docker compose exec -T php bin/console quire:settings:set "$setting" true
          done
          # The image's browsers must match the playwright package, so its version comes from package.json
          # (and Dependabot's updates of the package update the image too). The browser runs on the
          # Compose network, not the host's: there, containers that restart (e.g. the worker, after
          # extensions change) add and remove interfaces, which aborts its page loads.
          playwright=$(jq -r '.dependencies.playwright' tests/Accessibility/package.json)
          docker run --rm --network quire_default -e QUIRE_CHECK_SERVER=php -v "$PWD/tests/Accessibility:/work" -w /work "mcr.microsoft.com/playwright:v${playwright}-noble" \
            sh -c 'npm ci --no-audit --no-fund && node check.mjs https://quire.localhost / /blog/hello-world /about /login /register /forgot-password /verify-email'
      - name: Check the admin's accessibility (WCAG 2.2 AA, with axe-core)
        run: |
          docker compose exec -T php bin/console quire:extension:enable quire-admin --no-interaction
          printf 'correct-horse-42\ncorrect-horse-42\n' | docker compose exec -T php bin/console quire:user:create admin@example.com --role=admin
          playwright=$(jq -r '.dependencies.playwright' tests/Accessibility/package.json)
          docker run --rm --network quire_default -e QUIRE_CHECK_SERVER=php -e QUIRE_CHECK_LOGIN=admin:correct-horse-42 -v "$PWD/tests/Accessibility:/work" -w /work "mcr.microsoft.com/playwright:v${playwright}-noble" \
            sh -c 'npm ci --no-audit --no-fund && node check.mjs https://quire.localhost /admin /admin/content/post /admin/content/page "/admin/content/post?q=hello" /admin/content/post/new /admin/content/page/new /admin/settings /admin/settings/content /admin/themes /admin/extensions /admin/extensions/quire-admin/purge /admin/users /admin/users/new /admin/roles /admin/roles/member /admin/roles/admin "/admin/access?user=admin&ability=quire.settings.manage"'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs

  skeleton:
    name: Starter project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate composer.json
        run: docker run --rm -v "$PWD/skeleton:/app" -w /app composer:2 validate --strict --no-check-publish
      - name: Create a site from the skeleton, as its README says, with the packages of this commit
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/work" -w /work composer:2 \
            create-project --no-install --repository='{"type": "path", "url": "/repo/skeleton", "options": {"symlink": false, "versions": {"quire/skeleton": "0.1.x-dev"}}}' \
            quire/skeleton site 0.1.x-dev
          # Instead of Packagist, the site installs the packages from a copy of packages/ inside it, which
          # its container sees. They're development versions of the next release.
          cp -r packages "$RUNNER_TEMP/site/quire-packages"
          versions=$(jq -n '[inputs.name] | map({(.): "0.1.x-dev"}) | add' packages/*/composer.json)
          jq --indent 4 --argjson versions "$versions" '.repositories = [{"type": "path", "url": "quire-packages/*", "options": {"versions": $versions}}] | ."minimum-stability" = "dev"' \
            "$RUNNER_TEMP/site/composer.json" > composer.json.site && mv composer.json.site "$RUNNER_TEMP/site/composer.json"
      - name: Check the site has its own secret
        run: grep -Eq '^APP_SECRET=[0-9a-f]{32}$' "$RUNNER_TEMP/site/.env.dev"
      - name: Start the site
        working-directory: ${{ runner.temp }}/site
        run: |
          docker compose build --pull
          docker compose up --wait
      - name: Install the site
        working-directory: ${{ runner.temp }}/site
        run: docker compose exec -T php bin/console quire:install --no-interaction --admin-email=ada@example.com --title="Ada's notes"
      - name: Check the site, and that it has the admin
        working-directory: ${{ runner.temp }}/site
        run: |
          curl -v --insecure --fail-with-body https://quire.localhost
          curl -v --insecure --fail-with-body https://quire.localhost/_quire/health
          docker compose exec -T php bin/console quire:extension:list | grep -E 'quire-admin +enabled'
          test "$(curl --insecure -s -o /dev/null -w '%{redirect_url}' https://quire.localhost/admin)" = 'https://quire.localhost/login'
      - name: Show logs on failure
        if: failure()
        working-directory: ${{ runner.temp }}/site
        run: docker compose logs

  prod:
    name: Production image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build prod image
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.prod.yaml
          set: |
            *.cache-from=type=gha,scope=prod-${{ github.ref }}
            *.cache-from=type=gha,scope=prod-refs/heads/main
            *.cache-to=type=gha,scope=prod-${{ github.ref }},mode=max
      - name: Generate throwaway secrets
        run: |
          for name in APP_SECRET POSTGRES_PASSWORD; do
            value="$(openssl rand -hex 16)"
            echo "::add-mask::${value}"
            echo "${name}=${value}" >> "${GITHUB_ENV}"
          done
      - name: Start services
        run: docker compose -f compose.yaml -f compose.prod.yaml up --wait --no-build
      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://quire.localhost
      - name: Check health endpoint
        run: curl -v --insecure --fail-with-body https://quire.localhost/_quire/health
      - name: Check the app runs as a non-root user
        run: test "$(docker compose -f compose.yaml -f compose.prod.yaml exec -T php id -u)" != "0"
      - name: Check the app can write to its storage volume
        run: docker compose -f compose.yaml -f compose.prod.yaml exec -T php sh -c 'touch storage/public/.check storage/private/.check && rm storage/public/.check storage/private/.check'
      - name: Show logs on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.prod.yaml logs
