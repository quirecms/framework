---
name: Split

# Copies each package (see .github/split.json) to its own read-only repository, which Packagist
# installs it from: main to their main, and each version tag to every repository (all packages are
# released together, with the same version).
on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: read

# One at a time, in order, so that a repository never goes back to an older commit.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # A version tag reaches Packagist from here, so it's split only when it's signed by a key in
  # .github/release-signers (ADR-0010): checked in a job of its own, which never sees the GitHub App's
  # credentials. Main's pushes have nothing to check.
  signed:
    name: Signed by a release signer
    if: github.repository == 'quirecms/framework'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is signed by a key in .github/release-signers
        if: startsWith(github.ref, 'refs/tags/')
        run: .github/verify-tag.sh "$GITHUB_REF_NAME"

  split:
    name: Split packages
    needs: signed
    if: github.repository == 'quirecms/framework'
    # Holds the GitHub App's credentials, which only main and version tags can use.
    environment: split
    runs-on: ubuntu-26.04
    permissions:
      actions: read     # CI's runs, to wait for it
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A version tag reaches Packagist from here, so it waits for CI on main as Release does. Main's
      # own pushes don't: they're the development versions, and main is only changed by pull requests
      # that passed CI.
      - name: CI passed on it
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/ci-passed.sh "$GITHUB_SHA"
      - name: List the repositories
        id: repositories
        run: echo "names=$(jq -r 'map(.repository | split("/")[1]) | join(",")' .github/split.json)" >> "$GITHUB_OUTPUT"
      # A GitHub App of the organisation, installed on those repositories, with permission to write
      # their contents and workflows. Its token lasts an hour and can't write anywhere else.
      - name: Get a token for the repositories
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SPLIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repositories.outputs.names }}
          permission-contents: write
          permission-workflows: write
      # What's pushed is $GITHUB_REF as this checkout has it: a tag moved since the signed job checked it
      # would be pushed unchecked. Main isn't checked: when it moves meanwhile, its newer run splits it.
      - name: Still the commit checked
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] || [ "$(git rev-parse "$GITHUB_REF^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF no longer names $GITHUB_SHA, the commit checked: nothing is pushed."
            exit 1
          fi
      - name: Split and push
        run: .github/split.sh "$GITHUB_REF" --push
        env:
          GIT_TOKEN: ${{ steps.token.outputs.token }}
