'Sign in': 'Anmelden'
'Sign out': 'Abmelden'
'Email or username': 'E-Mail oder Benutzername'
'Password': 'Passwort'
'Keep me signed in on this device': 'Auf diesem Gerät angemeldet bleiben'
"You're signed in as {name}.": 'Sie sind als {name} angemeldet.'
'Signing in with a password is turned off.': 'Die Anmeldung mit Passwort ist ausgeschaltet.'
"Preview: this isn't published, so only people who may see unpublished content see it.": 'Vorschau: Dieser Inhalt ist nicht veröffentlicht und nur für Personen sichtbar, die Unveröffentlichtes sehen dürfen.'
"Create an account": "Konto erstellen"
"Name": "Name"
"Email": "E-Mail"
"At least 8 characters.": "Mindestens 8 Zeichen."
"Create account": "Konto erstellen"
"Already have an account?": "Sie haben schon ein Konto?"
"New here?": "Neu hier?"
"Forgot your password?": "Passwort vergessen?"
"Enter your email address, and we'll send you a link to choose a new password.": "Geben Sie Ihre E-Mail-Adresse ein. Wir schicken Ihnen einen Link, mit dem Sie ein neues Passwort wählen."
"Send the link": "Link senden"
"Back to signing in": "Zurück zur Anmeldung"
"Choose a new password": "Neues Passwort wählen"
"New password": "Neues Passwort"
"Change password": "Passwort ändern"
"Confirm your email address": "Bestätigen Sie Ihre E-Mail-Adresse"
"Didn't get the email, or did the link expire? Enter your email address for a new one.": "Keine E-Mail bekommen, oder ist der Link abgelaufen? Geben Sie Ihre E-Mail-Adresse ein, um einen neuen zu erhalten."
"Check your inbox": "Sehen Sie in Ihr Postfach"
"If {email} has an account with us, we've sent it an email with a link. It can take a few minutes; check your spam folder too.": "Wenn es zu {email} ein Konto gibt, haben wir eine E-Mail mit einem Link dorthin geschickt. Das kann einige Minuten dauern; sehen Sie auch im Spam-Ordner nach."
"This link doesn't work anymore": "Dieser Link funktioniert nicht mehr"
"Links in our emails work once, for a limited time, and only the newest one does.": "Links in unseren E-Mails funktionieren einmal und für begrenzte Zeit, und nur der neueste."
"Get a new link": "Neuen Link anfordern"
"Send a new link": "Neuen Link senden"
"The form expired. Please try again.": "Das Formular ist abgelaufen. Bitte versuchen Sie es noch einmal."
"Too many attempts. Please try again in a few minutes.": "Zu viele Versuche. Bitte versuchen Sie es in ein paar Minuten noch einmal."
"Enter your email address.": "Geben Sie Ihre E-Mail-Adresse ein."
"Enter a valid email address.": "Geben Sie eine gültige E-Mail-Adresse ein."
"Another user has this email.": "Diese E-Mail-Adresse wird schon verwendet."
"Passwords must be at least 8 characters long.": "Passwörter müssen mindestens 8 Zeichen lang sein."
"The display name must be 1 to 100 characters long.": "Der Name muss 1 bis 100 Zeichen lang sein."
"This link doesn't work anymore.": "Dieser Link funktioniert nicht mehr."
"Your email address is confirmed. You can sign in now.": "Ihre E-Mail-Adresse ist bestätigt. Sie können sich jetzt anmelden."
"Your password is changed. You can sign in with it now.": "Ihr Passwort ist geändert. Sie können sich jetzt damit anmelden."
"Reset your password": "Passwort zurücksetzen"
"You already have an account": "Sie haben schon ein Konto"
"Hello {name},": "Hallo {name},"
"Someone asked to reset the password of your account. If it was you, choose a new password here:": "Jemand möchte das Passwort Ihres Kontos zurücksetzen. Wenn Sie das waren, wählen Sie hier ein neues Passwort:"
"The link works once, for one hour. If you didn't ask for it, ignore this email: your password stays as it is.": "Der Link funktioniert einmal, eine Stunde lang. Wenn Sie ihn nicht angefordert haben, ignorieren Sie diese E-Mail: Ihr Passwort bleibt, wie es ist."
"Please confirm that this is your email address, so you can sign in:": "Bitte bestätigen Sie, dass dies Ihre E-Mail-Adresse ist, damit Sie sich anmelden können:"
"Confirm my email address": "E-Mail-Adresse bestätigen"
"The link works for two days. If you didn't create an account, ignore this email.": "Der Link funktioniert zwei Tage lang. Wenn Sie kein Konto erstellt haben, ignorieren Sie diese E-Mail."
"Someone tried to create an account with your email address, but you already have one.": "Jemand wollte mit Ihrer E-Mail-Adresse ein Konto erstellen, aber Sie haben schon eines."
"If it wasn't you, ignore this email: nothing changed.": "Wenn Sie das nicht waren, ignorieren Sie diese E-Mail: Es hat sich nichts geändert."
"You're invited to {site}": "Einladung zu {site}"
"Choose your password": "Wählen Sie Ihr Passwort"
"Save password": "Passwort speichern"
"Welcome to {site}, {name}. Choose the password you'll sign in with as {username}.": "Willkommen bei {site}, {name}. Wählen Sie das Passwort, mit dem Sie sich als {username} anmelden."
"Ask the person who invited you to send a new invitation.": "Bitten Sie die Person, die Sie eingeladen hat, um eine neue Einladung."
"{admin} added you to {site}, as {username}. Choose your password to sign in:": "{admin} hat Sie zu {site} hinzugefügt, als {username}. Wählen Sie Ihr Passwort, um sich anzumelden:"
"You were added to {site}, as {username}. Choose your password to sign in:": "Sie wurden zu {site} hinzugefügt, als {username}. Wählen Sie Ihr Passwort, um sich anzumelden:"
"The link works once, for seven days.": "Der Link funktioniert einmal, sieben Tage lang."
"Welcome! Sign in with your new password.": "Willkommen! Melden Sie sich mit Ihrem neuen Passwort an."
