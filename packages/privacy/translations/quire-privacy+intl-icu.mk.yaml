# The privacy notice, the proof of consent and the admin page
"This site uses no services of other companies.": "Овој сајт не користи услуги од други компании."
"You can change your choice at any time with “Cookie settings”.": "Изборот можете да го промените во секое време преку „Поставки за колачиња“."
"Your choice’s ID, if you ask the site what you agreed to:": "Ознаката на вашиот избор, ако го прашате сајтот на што сте се согласиле:"
"Keep proof of consent for (months)": "Чувај доказ за согласноста (месеци)"
"Each choice is kept with what visitors were told, then removed. At most 60.": "Секој избор се чува заедно со она што им било кажано на посетителите, а потоа се брише. Најмногу 60."
"Privacy and cookies": "Приватност и колачиња"
"What visitors see": "Што гледаат посетителите"
"Visitors see no banner: no enabled extension or theme uses a service of another company that they must be asked about.": "Посетителите не гледаат банер: ниту едно вклучено проширување или тема не користи услуга од друга компанија за која мора да бидат прашани."
"Visitors see a banner that asks about: {services}.": "Посетителите гледаат банер што прашува за: {services}."
"With one kind of service, the banner asks about it by name; visitors accept or reject it.": "Со еден вид услуга, банерот прашува за неа по име; посетителите ја прифаќаат или одбиваат."
"With several kinds of service, visitors accept all, reject all, or choose.": "Со повеќе видови услуги, посетителите прифаќаат сè, одбиваат сè или избираат."
"Test mode: here, nothing is sent to the services, even after visitors accept. It runs outside production and on other domains than the site's own, unless \"Send outside production too\" is on.": "Тест-режим: тука ништо не се праќа до услугите, дури ни откако посетителите ќе прифатат. Важи надвор од продукција и на други домени освен сопствениот на сајтот, освен ако е вклучено „Испраќај и надвор од продукција“."
"The site has services of other companies but no privacy notice linked: visitors must be able to read what happens with their data. Write one (a page, with [[privacy_services]] listing the services) and set it in the settings.": "Сајтот користи услуги од други компании, но нема поврзано известување за приватност: посетителите мора да можат да прочитаат што се случува со нивните податоци. Напишете едно (страница во која [[privacy_services]] ги наведува услугите) и поставете го во поставките."
"Settings": "Поставки"
"Necessary, and reaching other sites: check these": "Неопходни, а пристапуваат до други сајтови: проверете ги"
"These services run without asking visitors, because their extension or theme says the site can't work without them. Yet they reach other sites. If one isn't truly needed, e.g. it tracks visitors, it must be asked about: tell its maker, or disable it.": "Овие услуги работат без да се прашаат посетителите, бидејќи нивното проширување или тема вели дека сајтот не може без нив. Сепак, тие пристапуваат до други сајтови. Ако некоја не е навистина потребна, на пр. ги следи посетителите, мора да се прашува за неа: кажете му на нејзиниот автор или исклучете ја."
"Service": "Услуга"
"Declared by": "Ја пријавува"
"Services visitors are asked about": "Услуги за кои се прашуваат посетителите"
"From what the site's extensions and theme declare. The answers count the choices of the last 30 days.": "Според она што го пријавуваат проширувањата и темата на сајтот. Одговорите ги бројат изборите од последните 30 дена."
"Kind": "Вид"
"Allowed": "Дозволено"
"Refused": "Одбиено"
"Preview, in the site's look": "Преглед, во изгледот на сајтот"
"The banner, on a first visit": "Банерот, при прва посета"
"On a first visit": "При прва посета"
"The cookie settings": "Поставките за колачиња"
"“Cookie settings”": "„Поставки за колачиња“"
"A visitor's choices": "Изборите на посетител"
"Visitors find the ID of their choice in “Cookie settings”. Choices are kept for {months, plural, one {# month} other {# months}}, with what visitors were told; never their account or address.": "Посетителите ја наоѓаат ознаката на својот избор во „Поставки за колачиња“. Изборите се чуваат {months, plural, one {# месец} other {# месеци}}, заедно со она што им било кажано на посетителите; никогаш нивната сметка или адреса."
"Choice ID": "Ознака на изборот"
