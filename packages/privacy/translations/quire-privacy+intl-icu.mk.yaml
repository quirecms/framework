Needed for the site to work, e.g. to sign in. Always on.: Потребни за да работи страницата, на пр. за најава. Секогаш вклучени.
Remember your choices, e.g. fonts or a map's settings.: Ги паметат вашите избори, на пр. фонтови или поставки на мапа.
Count visits for this site only, without sharing them.: Ги бројат посетите само за оваа страница, без да ги споделуваат.
Help the site see how it's used, through an analytics service.: Ѝ покажуваат на страницата како се користи, преку услуга за аналитика.
Videos and other content from companies that may follow you across sites.: Видеа и друга содржина од компании што може да ве следат низ страниците.
