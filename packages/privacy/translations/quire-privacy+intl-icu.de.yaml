consent.single.text.statistics-own: Diese Website möchte Besuche nur für sich zählen, ohne sie weiterzugeben. Ohne Ihre Zustimmung wird nichts gezählt.
consent.single.text.preferences: Diese Website möchte Dienste verwenden, die sich Ihre Auswahl merken, z. B. Schriften. Sie bleiben aus, wenn Sie sie nicht akzeptieren.
consent.single.text.marketing: Diese Website möchte Inhalte von Unternehmen zeigen, die Sie über Websites hinweg verfolgen können, z. B. Videos. Sie bleiben aus, wenn Sie sie nicht akzeptieren.
