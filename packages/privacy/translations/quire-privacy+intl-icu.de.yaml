# The privacy notice, the proof of consent and the admin page
"This site uses no services of other companies.": "Diese Website nutzt keine Dienste anderer Unternehmen."
"You can change your choice at any time with “Cookie settings”.": "Sie können Ihre Wahl jederzeit unter „Cookie-Einstellungen“ ändern."
"Your choice’s ID, if you ask the site what you agreed to:": "Die Kennung Ihrer Wahl, falls Sie die Website fragen, wozu Sie zugestimmt haben:"
"Keep proof of consent for (months)": "Nachweis der Einwilligung aufbewahren (Monate)"
"Each choice is kept with what visitors were told, then removed; never before the choice itself expires. At most 60.": "Jede Wahl wird mit dem aufbewahrt, was Besuchern gesagt wurde, und dann gelöscht; nie bevor die Wahl selbst abläuft. Höchstens 60."
"Privacy and cookies": "Datenschutz und Cookies"
"What visitors see": "Was Besucher sehen"
"Visitors see no banner: no enabled extension or theme uses a service of another company that they must be asked about.": "Besucher sehen kein Banner: Keine aktivierte Erweiterung und kein Theme nutzt einen Dienst eines anderen Unternehmens, nach dem sie gefragt werden müssen."
"Visitors see a banner that asks about: {services}.": "Besucher sehen ein Banner, das nach Folgendem fragt: {services}."
"With one kind of service, the banner asks about it by name; visitors accept or reject it.": "Bei nur einer Art von Dienst fragt das Banner namentlich danach; Besucher akzeptieren oder lehnen ab."
"With several kinds of service, visitors accept all, reject all, or choose.": "Bei mehreren Arten von Diensten akzeptieren Besucher alle, lehnen alle ab oder wählen aus."
"Test mode: here, nothing is sent to the services, even after visitors accept. It runs outside production and on other domains than the site's own, unless \"Send outside production too\" is on.": "Testmodus: Hier wird nichts an die Dienste gesendet, auch nicht nach der Zustimmung. Er gilt außerhalb der Produktion und auf anderen Domains als der eigenen der Website, außer „Auch außerhalb der Produktion senden“ ist an."
"The site has services of other companies but no privacy notice linked: visitors must be able to read what happens with their data. Write one (a page, with [[privacy_services]] listing the services) and set it in the settings.": "Die Website nutzt Dienste anderer Unternehmen, verlinkt aber keine Datenschutzerklärung: Besucher müssen nachlesen können, was mit ihren Daten geschieht. Schreiben Sie eine (eine Seite, auf der [[privacy_services]] die Dienste auflistet) und legen Sie sie in den Einstellungen fest."
"Settings": "Einstellungen"
"Necessary, and reaching other sites: check these": "Notwendig und mit Zugriff auf andere Websites: bitte prüfen"
"These services run without asking visitors, because their extension or theme says the site can't work without them. Yet they reach other sites. If one isn't truly needed, e.g. it tracks visitors, it must be asked about: tell its maker, or disable it.": "Diese Dienste laufen ohne Nachfrage, weil ihre Erweiterung oder ihr Theme angibt, dass die Website ohne sie nicht funktioniert. Dennoch greifen sie auf andere Websites zu. Ist einer nicht wirklich nötig, z. B. weil er Besucher verfolgt, muss nach ihm gefragt werden: Sagen Sie es seinem Hersteller oder deaktivieren Sie ihn."
"Service": "Dienst"
"Declared by": "Angegeben von"
"Services visitors are asked about": "Dienste, nach denen Besucher gefragt werden"
"From what the site's extensions and theme declare. The answers count the choices of the last 30 days.": "Nach den Angaben der Erweiterungen und des Themes der Website. Die Antworten zählen die Wahlen der letzten 30 Tage."
"Kind": "Art"
"Allowed": "Erlaubt"
"Refused": "Abgelehnt"
"Preview, in the site's look": "Vorschau im Aussehen der Website"
"The banner, on a first visit": "Das Banner beim ersten Besuch"
"On a first visit": "Beim ersten Besuch"
"The cookie settings": "Die Cookie-Einstellungen"
"“Cookie settings”": "„Cookie-Einstellungen“"
"A visitor's choices": "Die Wahlen eines Besuchers"
"Visitors find the ID of their choice in “Cookie settings”. Choices are kept for {months, plural, one {# month} other {# months}}, with what visitors were told; never their account or address.": "Besucher finden die Kennung ihrer Wahl unter „Cookie-Einstellungen“. Wahlen werden {months, plural, one {# Monat} other {# Monate}} lang aufbewahrt, mit dem, was Besuchern gesagt wurde; nie ihr Konto oder ihre Adresse."
"Choice ID": "Kennung der Wahl"
"Look up": "Nachschlagen"
"A choice's ID is 32 characters, 0–9 and a–f.": "Die Kennung einer Wahl hat 32 Zeichen, 0–9 und a–f."
"No choice with this ID is kept.": "Es ist keine Wahl mit dieser Kennung gespeichert."
"allowed": "erlaubt"
"refused": "abgelehnt"
"not asked": "nicht gefragt"
