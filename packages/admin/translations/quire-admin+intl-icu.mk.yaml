"Say when, e.g. “friday 18:00” or “tomorrow at 9”.": "Кажете кога, засега на англиски, на пр. „friday 18:00“ или „tomorrow at 9“."
"That doesn’t fit the setting: {problem}.": "Тоа не одговара на поставката: {problem}."
"That time has passed.": "Тоа време помина."
"The site looks like the theme {theme}; it’s rebuilt, which takes a few seconds.": "Сајтот изгледа како темата {theme}; повторно се гради, што трае неколку секунди."
"The site uses {theme} already.": "Сајтот веќе ја користи {theme}."
"as {role}": "како {role}"
"{emails} get an email to choose their own password; the link works once, for 7 days.": "{emails} добиваат е-порака за да ја изберат својата лозинка; линкот работи еднаш, 7 дена."
"{name} can sign in again.": "{name} повторно може да се најавува."
"{name} can sign in already.": "{name} веќе може да се најавува."
"{name} can’t sign in any more, and is signed out on their next request.": "{name} повеќе не може да се најавува и се одјавува при следното барање."
"{name} is suspended already.": "{name} е веќе суспендиран."
"{setting}: {from} → {to}.": "{setting}: {from} → {to}."
"{title} can’t be {verb} as it is now ({status}).": "{title} не може да се {verb} каква што е сега ({status})."
"{title} comes back from the trash.": "{title} се враќа од корпата."
"{title} goes live by itself on {when}.": "{title} оди во живо само по себе на {when}."
"{title} goes live now, for everyone.": "{title} оди во живо сега, за сите."
"{title} is in the trash already.": "{title} е веќе во корпата."
"{title} is taken off the site: only people who edit can see it.": "{title} се симнува од сајтот: можат да ја видат само луѓето што уредуваат."
"{title} isn’t in the trash.": "{title} не е во корпата."
"{title} moves to the trash; you can restore it from there.": "{title} оди во корпата; оттаму може да ја вратите."
"intent.verb.publish": "Објави"
"intent.verb.unpublish": "Симни од сајтот"
"intent.verb.schedule": "Закажи"
"intent.verb.trash": "Премести во корпата"
"intent.verb.restore": "Врати"
"intent.verb.suspend": "Суспендирај"
"intent.verb.activate": "Пушти повторно"
"intent.verb.invite": "Покани"
"intent.verb.theme": "Користи ја темата"
"intent.verb.set": "Постави"
"intent.past.publish": "објави"
"intent.past.unpublish": "симне од сајтот"
"intent.past.schedule": "закаже"
"find.content": "Содржина"
"find.people": "Луѓе"
"find.settings": "Поставки"
"find.pages": "Страници"
"Back to the text": "Назад кон текстот"
"saved {time}": "зачувано {time}"
"saved {time}. Someone published changes since you opened this: they're kept, and yours are combined with them when you publish.": "зачувано {time}. Некој објави промени откако го отворивте ова: тие се задржуваат, а Вашите се спојуваат со нив кога ќе објавите."
"Live · published again since you opened it": "Во живо · повторно објавено откако го отворивте"
"Someone published changes since you opened this. They're kept: yours are combined with them when you publish.": "Некој објави промени откако го отворивте ова. Тие се задржуваат: Вашите се спојуваат со нив кога ќе објавите."
"This item was published again after you opened it, and the version you opened is no longer kept, so what changed can't be combined with your text. What you entered is below and isn't saved. Save again to make it your changes to the live version, or open the item in a new tab to see what's live first.": "Оваа ставка повторно е објавена откако ја отворивте, а верзијата што ја отворивте повеќе не се чува, па она што се променило не може да се спои со Вашиот текст. Она што го внесовте е подолу и не е зачувано. Зачувајте повторно за тоа да станат Вашите промени на верзијата во живо, или отворете ја ставката во нова картичка за прво да видите што е во живо."
"Your earlier changes": "Вашите претходни промени"
"Saved before these, and not shown here: open them to compare, publish or discard them.": "Зачувани пред овие и не се прикажани тука: отворете ги за да ги споредите, објавите или отфрлите."
"Changes of {when}": "Промени од {when}"
"Your changes are the old version now. Publish them to restore it.": "Вашите промени сега се старата верзија. Објавете ги за да ја вратите."
"Your changes were saved while you looked at the history, e.g. in another tab. Look at them, then try again.": "Вашите промени се зачувани додека ја гледавте историјата, на пр. во друга картичка. Погледнете ги, па обидете се повторно."
"Replace your changes with this version? What you changed is replaced.": "Да се заменат Вашите промени со оваа верзија? Она што го променивте се заменува."
"Replace your changes with this version": "Замени ги Вашите промени со оваа верзија"
"You can't give or take away {abilities}: you don't have it yourself.": "Не можете да давате или одземате {abilities}: самите го немате."
"You can't start a role from “{role}”: it can do things you can't ({abilities}).": "Не можете да започнете улога од „{role}“: може да прави работи што Вие не можете ({abilities})."
"You can't delete “{role}”: it can do things you can't ({abilities}).": "Не можете да ја избришете „{role}“: може да прави работи што Вие не можете ({abilities})."
"You don't have this, so you can't give it or take it away.": "Ова го немате, па не можете да го давате или одземате."
"Passwords aren't set for others: email them a link to choose a new one.": "Лозинки не се поставуваат за други: испратете им линк по е-пошта за да изберат нова."
"{name} couldn't be told at their old address: {problem}": "На {name} не можеше да му се јави на старата адреса: {problem}"
"Emailed {name} a link to choose a new password. It works for a day; until then, their password stays as it is.": "На {name} му е испратен линк по е-пошта за избор на нова лозинка. Работи еден ден; дотогаш лозинката останува иста."
"The link couldn't be sent: {problem}": "Линкот не можеше да се испрати: {problem}"
"You can't manage {name}: they can do things you can't ({abilities}).": "Не можете да управувате со {name}: може да прави работи што Вие не можете ({abilities})."
"You can't give the role “{role}”: it can do things you can't ({abilities}).": "Не можете да ја доделите улогата „{role}“: може да прави работи што Вие не можете ({abilities})."
"it can do things you can't, so you can't give it or take it away": "може да прави работи што Вие не можете, па не можете да ја давате или одземате"
"Nobody sets another person's password, so nobody else knows it: email them a link to choose a new one.": "Никој не поставува лозинка на друго лице, па никој друг не ја знае: испратете му линк по е-пошта за да избере нова."
"Leave empty to keep it.": "Оставете празно за да ја задржите."
"Confirm it's you, then import the file again.": "Потврдете дека сте Вие, па внесете ја датотеката повторно."
"That setting isn't on this page.": "Таа поставка не е на оваа страница."
"{role} get: {abilities}.": "{role} добиваат: {abilities}."
"{role} lose: {abilities}.": "{role} губат: {abilities}."
"Confirm it's you": "Потврдете дека сте Вие"
"What you're about to do changes who may do what on the site, or runs new code on it. So that an open or stolen session isn't enough, show it's you. It holds for {minutes} minutes.": "Она што ќе го направите менува кој што смее на сајтот или извршува нов код на него. За да не е доволна отворена или украдена сесија, покажете дека сте Вие. Важи {minutes} минути."
"Your password": "Вашата лозинка"
"That isn't your password, or there were too many tries: wait a few minutes.": "Тоа не е Вашата лозинка или имаше премногу обиди: почекајте неколку минути."
"Confirm": "Потврди"
"Go back": "Оди назад"
"You sign in without a password here: sign out, sign in again, and come back to do it.": "Тука се најавувате без лозинка: одјавете се, најавете се повторно и вратете се за да го направите тоа."
"{count, plural, one {The theme has a problem:} other {The theme has # problems:}}": "{count, plural, =1 {Темата има проблем:} one {Темата има # проблем:} other {Темата има # проблеми:}}"
"{count, plural, one {# warning about the theme} other {# warnings about the theme}}": "{count, plural, one {# предупредување за темата} other {# предупредувања за темата}}"
"Setup": "Поставување"
"Whoever runs the site sets these where it's deployed; they're shown here so you know how the site is set up.": "Тој што го води сајтот ги поставува овие таму каде што е поставен; прикажани се тука за да знаете како е поставен сајтот."
"The site's address": "Адресата на сајтот"
"Not set: e-mails can't link to the site. It's DEFAULT_URI in the site's environment.": "Не е поставена: е-пораките не можат да водат до сајтот. Тоа е DEFAULT_URI во околината на сајтот."
"Changed by whoever runs the site: DEFAULT_URI, or the domains on Quire Server.": "Ја менува тој што го води сајтот: DEFAULT_URI или домените на Quire Server."
"E-mail": "Е-пошта"
"set up": "поставено"
"The site sends e-mails: invitations, password resets, confirmations.": "Сајтот испраќа е-пораки: покани, ресетирање лозинки, потврди."
"The site sends no e-mails: no mail server is set (MAILER_DSN). Invitations and password resets don't arrive.": "Сајтот не испраќа е-пораки: не е поставен сервер за пошта (MAILER_DSN). Поканите и ресетирањата лозинки не пристигнуваат."
"Sent as": "Се испраќа како"
"the site's title and noreply@ its domain": "насловот на сајтот и noreply@ неговиот домен"
"Change it in the settings": "Променете го во поставките"
"The mail server is set by whoever runs the site (MAILER_DSN, or site:mail on Quire Server); it holds a password, so it isn't shown.": "Серверот за пошта го поставува тој што го води сајтот (MAILER_DSN или site:mail на Quire Server); содржи лозинка, па не се прикажува."
"Send me a test e-mail": "Испрати ми пробна е-порака"
"To {email}, only.": "Само до {email}."
"Confirm your e-mail address to send yourself a test e-mail.": "Потврдете ја Вашата адреса за е-пошта за да си испратите пробна е-порака."
"Security policy": "Безбедносна политика"
"Report only: browsers report what the policy would block, and block nothing.": "Само известува: прелистувачите известуваат што би блокирала политиката и не блокираат ништо."
"enforced": "се применува"
"Browsers block what the policy doesn't allow.": "Прелистувачите блокираат сè што политиката не дозволува."
"Reports go to": "Извештаите одат до"
"nowhere": "никаде"
"What the site's pages may load from other sites": "Од што може да вчитуваат страниците на сајтот од други сајтови"
"Nothing: only the site itself.": "Ништо: само самиот сајт."
"For": "За"
"Why": "Зошто"
"A service visitors are asked about, or a necessary one": "Услуга за која се прашуваат посетителите, или неопходна"
"Privacy and cookies": "Приватност и колачиња"
"The site's configuration: loads for every visitor, without asking": "Конфигурацијата на сајтот: се вчитува за секој посетител, без прашање"
"Quire itself, e.g. where files are stored": "Самиот Quire, на пр. каде се чуваат датотеките"
"Pages with forms for passwords or accounts (signing in, registering) don't get the services' hosts: a script there could read what's typed.": "Страниците со формулари за лозинки или сметки (најава, регистрација) не ги добиваат хостовите на услугите: скрипта таму би можела да чита што се пишува."
"Changed by whoever runs the site, in config/packages/quire.yaml (\"quire.csp\"); services through quire/privacy.": "Ја менува тој што го води сајтот, во config/packages/quire.yaml (\"quire.csp\"); услугите преку quire/privacy."
"A test e-mail goes only to your own confirmed address: confirm your e-mail address first.": "Пробна е-порака оди само до Вашата потврдена адреса: прво потврдете ја адресата за е-пошта."
"You sent {count} test e-mails in the last hour: try again later.": "Во последниот час испративте {count} пробни е-пораки: обидете се подоцна."
"A test e-mail is on its way to {email}.": "Пробна е-порака е на пат до {email}."
"The site couldn't send it. Whoever runs the site finds the reason in its log.": "Сајтот не можеше да ја испрати. Тој што го води сајтот ја наоѓа причината во неговиот дневник."
"Seeing the site's setup takes the right to manage its settings.": "За гледање на поставувањето на сајтот е потребно право за управување со неговите поставки."
"The site's **security policy only reports**: it blocks nothing": "**Безбедносната политика** на сајтот **само известува**: не блокира ништо"
"See the setup": "Види го поставувањето"
"report only": "само известува"
"Neither injected scripts nor what visitors haven't allowed are blocked. Whoever runs the site sets \"quire.csp.mode\" back to \"enforce\".": "Не се блокираат ниту вметнати скрипти ниту она што посетителите не го дозволиле. Тој што го води сајтот го враќа \"quire.csp.mode\" на \"enforce\"."
"For readers": "За читателите"
"Nothing to tell them": "Ништо за кажување"
"Updated: something added or brought up to date": "Ажурирано: нешто е додадено или освежено"
"Corrected: something was wrong": "Исправено: нешто беше погрешно"
"What changed, for readers": "Што се промени, за читателите"
"Readers see it in the post's history, with the date. For a correction, say what was wrong and what it says now, e.g. \"An earlier version listed Old Town Field.\" Your own notes for editors stay in the version history.": "Читателите го гледаат во историјата на објавата, со датумот. За исправка, кажете што беше погрешно и што пишува сега, на пр. „Претходна верзија го наведуваше Old Town Field.“ Вашите белешки за уредниците остануваат во историјата на верзиите."
