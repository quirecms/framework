---
services:
  php:
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:-quire.localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-quire.localhost}:${HTTPS_PORT:-443}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      # Local storage disks: uploaded files, which must survive new containers.
      # See https://github.com/quirecms/framework/blob/main/docs/storage.md
      - storage_data:/app/storage
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

  # Runs background jobs and scheduled tasks, with the php service's image. It starts once php is
  # healthy, i.e. migrations ran, and restarts by itself, e.g. after extensions change.
  # See https://github.com/quirecms/framework/blob/main/docs/jobs.md
  worker:
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
    command: ["php", "bin/console", "messenger:consume", "quire", "--time-limit=3600", "--memory-limit=256M"]
    environment:
      DEFAULT_URI: https://${SERVER_NAME:-quire.localhost}:${HTTPS_PORT:-443}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-!ChangeMe!}@database:5432/${POSTGRES_DB:-app}?serverVersion=${POSTGRES_VERSION:-18}&charset=${POSTGRES_CHARSET:-utf8}
      # The php service runs the migrations.
      QUIRE_SKIP_MIGRATIONS: 1
    volumes:
      - storage_data:/app/storage
    healthcheck:
      # The worker touches this file every 15 seconds; long jobs delay it.
      test: ["CMD", "php", "-r", "exit(time() - (int) @filemtime('var/quire-worker.heartbeat') < 600 ? 0 : 1);"]
      start_period: 60s

###> doctrine/doctrine-bundle ###
  database:
    image: postgres:${POSTGRES_VERSION:-18}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # You should definitely change the password in production
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
      POSTGRES_USER: ${POSTGRES_USER:-app}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "${POSTGRES_DB:-app}", "-U", "${POSTGRES_USER:-app}"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      # PostgreSQL 18+ images keep data in a versioned subdirectory of /var/lib/postgresql
      - database_data:/var/lib/postgresql:rw
###< doctrine/doctrine-bundle ###

volumes:
  caddy_data:
  caddy_config:
  storage_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
