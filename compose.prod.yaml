---
# Production environment override. Its settings and secrets come from prod.env (see prod.env.dist and
# docs/docker.md): docker compose --env-file prod.env up --wait
# Those marked ":?" must be set: without them, Compose stops with that message instead of starting the
# site with a development default.
services:
  php:
    image: ${IMAGES_PREFIX:-}${COMPOSE_PROJECT_NAME:-quire}-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      SERVER_NAME: ${SERVER_NAME:?Set SERVER_NAME, the site's domain, in prod.env}, php:80
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in prod.env}
      # Where emails go, e.g. smtp://user:pass@smtp.example.com:587. Without it, no email is sent.
      MAILER_DSN: ${MAILER_DSN:-null://null}
      # Optional: how long browsers keep to HTTPS, and Caddy directives of your own (docs/docker.md)
      QUIRE_HSTS_MAX_AGE: ${QUIRE_HSTS_MAX_AGE:-31536000}
      CADDY_SERVER_EXTRA_DIRECTIVES: ${CADDY_SERVER_EXTRA_DIRECTIVES:-}

  worker:
    image: ${IMAGES_PREFIX:-}${COMPOSE_PROJECT_NAME:-quire}-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in prod.env}
      MAILER_DSN: ${MAILER_DSN:-null://null}

  database:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in prod.env}
